[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-ir"
version = "0.2.0"
description = "Schema validation and graph rewriting for Heterograph IRs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[tool.setuptools.packages.find]
include = ["loom*"]

